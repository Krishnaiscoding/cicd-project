name: CI/CD Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Build Docker Image
              run: docker build -t cicd-pipeline .
            - name: Run Tests
              run: docker run -d -p 8080:80 --name container-test cicd-pipeline && sleep 5 && curl http://localhost:8080 && docker stop container-test && docker rm container-test
    
    push:
        name: Push to Docker Hub
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_PASSWORD}}
            - name: Build Docker Image
              run: docker build -t ${{secrets.DOCKER_USERNAME}}/cicd-pipeline .
            - name: Push Docker Image
              run: docker push ${{secrets.DOCKER_USERNAME}}/cicd-pipeline